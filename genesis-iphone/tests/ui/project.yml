name: GenesisControllerUIQA
options:
  bundleIdPrefix: com.richardholguin
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: 16
    MARKETING_VERSION: 0.2.0
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    COMPRESS_PNG_FILES: NO
targets:
  GenesisController:
    type: application
    platform: iOS
    sources:
      - path: ../../ios/Sources
      - path: ../../ios/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.richardholguin.GenesisController.UIRegression
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: ../../build/ui-regression/Info.plist
      properties:
        CFBundleDisplayName: Agent Micro
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIRequiresFullScreen: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: Dictate a draft for your selected chat. Nothing is sent until you tap Send.
        NSSpeechRecognitionUsageDescription: Turn your speech into an editable chat draft.
        NSCameraUsageDescription: Scan the pairing code shown by Agent Micro Controller on your Mac.
        NSLocalNetworkUsageDescription: Find and talk to your Mac on your Wi-Fi, so it can receive your prompts.
        CFBundleURLTypes:
          - CFBundleURLName: com.richardholguin.genesis.pair
            CFBundleURLSchemes:
              - genesiscontroller
  GenesisControllerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ../../tests/ui
        excludes: [project.yml, README.md]
    dependencies:
      - target: GenesisController
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.richardholguin.GenesisControllerUITests
schemes:
  GenesisController:
    build:
      targets:
        GenesisController: all
    test:
      targets: [GenesisControllerUITests]
    run:
      config: Debug
    archive:
      config: Release
